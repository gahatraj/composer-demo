# This workflow will install Python dependencies, run tests and lint with uv
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: "0.9.28"
        python-version: "3.14"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked

    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run ruff check . --select=E9,F63,F7,F82 --output-format=full --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run ruff check . --exit-zero --select=E,F,W,C90 --line-length=127 --config "lint.mccabe.max-complexity = 10" --statistics

    - name: Test with pytest
      run: uv run pytest
